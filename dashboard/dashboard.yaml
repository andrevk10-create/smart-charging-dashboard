title: Smart Charging
views:
  - title: Laden
    path: laden
    icon: mdi:car-electric
    type: sections
    max_columns: 4
    dense_section_placement: true
    background: "linear-gradient(145deg, #20242a 0%, #272c33 48%, #1d2126 100%)"

    sections:
      ##########################################################################
      # AUDI / SOC
      ##########################################################################
      - type: grid
        cards:
          - type: custom:button-card
            entity: sensor.audi_e_tron_sportback_state_of_charge
            show_name: false
            show_state: false
            show_icon: false
            custom_fields:
              content: |
                [[[
                  const soc = Math.max(0, Math.min(100, Number(entity.state) || 0));
                  const target = states['sensor.audi_e_tron_sportback_target_state_of_charge']?.state ?? '—';
                  const smartRaw = states['sensor.ev_smart_charging_status']?.state ?? 'unknown';
                  const easeeRaw = states['sensor.links_status']?.state ?? 'unknown';
                  const raw = easeeRaw === 'charging' ? 'charging'
                    : easeeRaw === 'completed' ? 'charging_completed'
                    : easeeRaw === 'error' ? 'error'
                    : smartRaw;
                  const heroTitle = easeeRaw === 'charging' ? 'Nu laden' : 'Slim laden';
                  const labels = {
                    charging: 'Bezig met laden',
                    waiting_for_charging_to_begin: 'Wachten op laadmoment',
                    no_charging_planned: 'Geen laden gepland',
                    charging_completed: 'Laden voltooid',
                    error: 'Storing'
                  };
                  const status = labels[raw] ?? raw.replaceAll('_',' ');
                  const accent = raw === 'charging' ? '#41d166' : raw === 'waiting_for_charging_to_begin' ? '#ffb41f' : raw === 'error' ? '#ff5a52' : '#9aa4ae';
                  const battery = soc < 25 ? '#ff5a52' : soc < 60 ? '#ffb41f' : '#41d166';
                  return `
                    <div class="hero-head">
                      <div>
                        <div class="eyebrow">AUDI E-TRON</div>
                        <div class="hero-title">${heroTitle}</div>
                      </div>
                      <ha-icon icon="mdi:car-electric" class="car-icon"></ha-icon>
                    </div>
                    <div class="soc-row">
                      <div class="soc">${soc}<span>%</span></div>
                      <div class="target">Doel ${target}%</div>
                    </div>
                    <div class="battery-track"><div class="battery-fill" style="width:${soc}%;background:${battery}"></div></div>
                    <div class="status-pill"><span style="background:${accent};box-shadow:0 0 12px ${accent}"></span>${status}</div>
                  `;
                ]]]
            styles:
              grid:
                - grid-template-areas: '"content"'
                - grid-template-columns: 1fr
              card:
                - min-height: 255px
                - padding: 24px
                - border-radius: 24px
                - background: '#30363d'
                - color: '#f6f8fa'
                - border: 1px solid '#424a53'
                - box-shadow: 0 12px 28px rgba(0,0,0,.22)
              custom_fields:
                content:
                  - width: 100%
            card_mod:
              style: |
                :host {
                  --ha-card-background: #30363d !important;
                  --card-background-color: #30363d !important;
                  --ha-card-border-width: 0px !important;
                  --ha-card-border-color: transparent !important;
                  --primary-text-color: #f6f8fa !important;
                  --secondary-text-color: #aeb7c1 !important;
                }
                ha-card {
                  background: #30363d !important;
                  --ha-card-background: #30363d !important;
                  color: #f6f8fa !important;
                }
            extra_styles: |
              .hero-head{display:flex;align-items:flex-start;justify-content:space-between;color:#f6f8fa}
              .eyebrow{font-size:12px;letter-spacing:.18em;color:#aeb7c1}
              .hero-title{font-size:27px;font-weight:700;margin-top:5px}
              .car-icon{--mdc-icon-size:44px;color:#d8dee4}
              .soc-row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:24px;color:#f6f8fa}
              .soc{font-size:64px;font-weight:700;line-height:.9}.soc span{font-size:25px;margin-left:4px;color:#c6ced6}
              .target{font-size:16px;color:#c6ced6;padding-bottom:4px}
              .battery-track{height:13px;margin-top:22px;border-radius:999px;background:#454c55;overflow:hidden}
              .battery-fill{height:100%;border-radius:999px;transition:width .8s ease}
              .status-pill{display:table;margin:20px auto 0;padding:8px 14px;border-radius:999px;background:#3a4149;color:#f0f3f6;font-size:14px;border:1px solid #4b545e}
              .status-pill span{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:9px}

      ##########################################################################
      # PLANNING
      ##########################################################################
      - type: grid
        cards:
          - type: custom:button-card
            entity: sensor.ev_smart_charging_status
            show_name: false
            show_state: false
            show_icon: false
            custom_fields:
              content: |
                [[[
                  const complete = states['select.ev_smart_charging_charge_completion_time']?.state ?? '—';
                  const smartOn = states['switch.ev_smart_charging_smart_charging_activated']?.state === 'on';
                  const current = Number(states['sensor.ev_smart_charging_price']?.state);
                  const prices = states['sensor.ev_smart_charging_charging']?.attributes?.raw_two_days || [];
                  const now = Date.now();
                  const inTwelveHours = now + (12 * 60 * 60 * 1000);
                  const lowest = prices
                    .map((entry) => {
                      const start = new Date(entry.start).getTime();
                      const rawValue = Number(entry.value);
                      const value = Math.abs(rawValue) > 10 ? rawValue / 1000 : rawValue;
                      return { start, value };
                    })
                    .filter(({ start, value }) =>
                      Number.isFinite(start) && Number.isFinite(value) &&
                      start >= now && start <= inTwelveHours
                    )
                    .sort((a, b) => a.value - b.value)[0];
                  const money = n => Number.isFinite(n) ? `€ ${n.toFixed(5)} / kWh` : 'Niet beschikbaar';
                  const lowestText = lowest
                    ? `${money(lowest.value)} · ${new Date(lowest.start).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' })}`
                    : 'Niet beschikbaar';
                  return `
                    <div class="panel-title">PLANNING</div>
                    <div class="panel-subtitle">EV SMART CHARGING</div>
                    <div class="data-row"><ha-icon icon="mdi:clock-check-outline" style="color:#4f9dff"></ha-icon><span>Klaar om</span><b>${complete}</b></div>
                    <div class="data-row"><ha-icon icon="mdi:ev-station" style="color:${smartOn ? '#41d166' : '#98a2ad'}"></ha-icon><span>Slim laden</span><b style="color:${smartOn ? '#41d166' : '#c0c7ce'}">${smartOn ? 'Ingeschakeld' : 'Uitgeschakeld'}</b></div>
                    <div class="data-row"><ha-icon icon="mdi:currency-eur" style="color:#41d166"></ha-icon><span>Huidige prijs</span><b>${money(current)}</b></div>
                    <div class="data-row"><ha-icon icon="mdi:chart-line-variant" style="color:#ffb41f"></ha-icon><span>Laagste prijs (12u)</span><b>${lowestText}</b></div>
                  `;
                ]]]
            styles:
              grid:
                - grid-template-areas: '"content"'
                - grid-template-columns: 1fr
              card:
                - min-height: 255px
                - padding: 22px
                - border-radius: 24px
                - background: '#30363d'
                - color: '#f6f8fa'
                - border: 1px solid '#424a53'
                - box-shadow: 0 12px 28px rgba(0,0,0,.22)
              custom_fields:
                content:
                  - width: 100%
            card_mod:
              style: |
                ha-card {
                  background: #30363d !important;
                  --ha-card-background: #30363d !important;
                  color: #f6f8fa !important;
                }
            extra_styles: |
              .panel-title{font-size:17px;font-weight:700;letter-spacing:.08em;color:#f6f8fa}
              .panel-subtitle{font-size:12px;letter-spacing:.08em;color:#aeb7c1;margin-top:4px;margin-bottom:14px}
              .data-row{height:43px;display:grid;grid-template-columns:29px 1fr auto;align-items:center;padding:0 12px;margin-top:8px;border-radius:13px;background:#3a4149;border:1px solid #4b545e;color:#f2f4f7}
              .data-row ha-icon{--mdc-icon-size:22px}.data-row span{font-size:14px}.data-row b{font-size:13px;font-weight:600;color:#f2f4f7}

      ##########################################################################
      # LAADSESSIE
      ##########################################################################
      - type: grid
        cards:
          - type: custom:button-card
            entity: sensor.links_sessie_energie
            show_name: false
            show_state: false
            show_icon: false
            custom_fields:
              content: |
                [[[
                  const value = (id,d=2) => {
                    const raw = states[id]?.state;
                    const n = Number(raw);
                    return Number.isFinite(n) ? n.toLocaleString('nl-NL',{maximumFractionDigits:d}) : (raw ?? '—');
                  };
                  const connection = states['binary_sensor.links_online'] ?? states['sensor.links_online'];
                  const onlineRaw = (connection?.state ?? 'onbekend').toLowerCase();
                  const online = ['verbonden','connected','online','on','true'].includes(onlineRaw);
                  const offline = ['niet verbonden','disconnected','offline','off','false'].includes(onlineRaw);
                  const connectionText = online ? 'Verbonden' : offline ? 'Offline' : (connection?.state ?? 'Onbekend');
                  return `
                    <div class="panel-title">LAADSESSIE</div>
                    <div class="panel-subtitle">EASEE</div>
                    <div class="data-row"><ha-icon icon="mdi:lightning-bolt" style="color:#41d166"></ha-icon><span>Energie</span><b>${value('sensor.links_sessie_energie')} kWh</b></div>
                    <div class="data-row"><ha-icon icon="mdi:current-ac" style="color:#ffb41f"></ha-icon><span>Laadstroom</span><b>${value('sensor.links_laadstroom',2)} A</b></div>
                    <div class="data-row"><ha-icon icon="mdi:sine-wave" style="color:#4f9dff"></ha-icon><span>Spanning</span><b>${value('sensor.links_voltage',1)} V</b></div>
                    <div class="data-row"><ha-icon icon="mdi:access-point" style="color:${online ? '#41d166' : offline ? '#ff5a52' : '#ffb41f'}"></ha-icon><span>Verbinding</span><b style="color:${online ? '#41d166' : offline ? '#ff5a52' : '#ffb41f'}">${connectionText}</b></div>
                  `;
                ]]]
            styles:
              grid:
                - grid-template-areas: '"content"'
                - grid-template-columns: 1fr
              card:
                - min-height: 255px
                - padding: 22px
                - border-radius: 24px
                - background: '#30363d'
                - color: '#f6f8fa'
                - border: 1px solid '#424a53'
                - box-shadow: 0 12px 28px rgba(0,0,0,.22)
              custom_fields:
                content:
                  - width: 100%
            card_mod:
              style: |
                ha-card {
                  background: #30363d !important;
                  --ha-card-background: #30363d !important;
                  color: #f6f8fa !important;
                }
            extra_styles: |
              .panel-title{font-size:17px;font-weight:700;letter-spacing:.08em;color:#f6f8fa}
              .panel-subtitle{font-size:12px;letter-spacing:.08em;color:#aeb7c1;margin-top:4px;margin-bottom:14px}
              .data-row{height:43px;display:grid;grid-template-columns:29px 1fr auto;align-items:center;padding:0 12px;margin-top:8px;border-radius:13px;background:#3a4149;border:1px solid #4b545e;color:#f2f4f7}
              .data-row ha-icon{--mdc-icon-size:22px}.data-row span{font-size:14px}.data-row b{font-size:13px;font-weight:600;color:#f2f4f7}

      ##########################################################################
      # AUDI STATUS
      ##########################################################################
      - type: grid
        cards:
          - type: custom:button-card
            entity: sensor.audi_e_tron_sportback_state_of_charge
            show_name: false
            show_state: false
            show_icon: false
            custom_fields:
              content: |
                [[[
                  const clean = state => {
                    if (!state || ['unknown','unavailable','none','null'].includes(String(state).toLowerCase())) return 'Niet beschikbaar';
                    return state;
                  };
                  const remaining = states['sensor.audi_e_tron_sportback_remaining_charge_time'];
                  const range = states['sensor.audi_e_tron_sportback_range'];
                  const doors = states['lock.audi_e_tron_sportback_door_lock'];
                  const climate = states['sensor.audi_e_tron_sportback_climatisation_state'];

                  const remainingText = remaining
                    ? `${clean(remaining.state)}${remaining.attributes?.unit_of_measurement ? ' ' + remaining.attributes.unit_of_measurement : ''}`
                    : 'Niet beschikbaar';
                  const rangeText = range
                    ? `${clean(range.state)}${range.attributes?.unit_of_measurement ? ' ' + range.attributes.unit_of_measurement : ' km'}`
                    : 'Niet beschikbaar';

                  const doorRaw = clean(doors?.state);
                  const doorKey = String(doorRaw).toLowerCase();
                  const locked = ['locked','vergrendeld','gesloten','off'].includes(doorKey);
                  const doorText = locked ? 'Vergrendeld' :
                    ['unlocked','ontgrendeld','open','on'].includes(doorKey) ? 'Niet vergrendeld' : doorRaw;

                  const climateRaw = clean(climate?.state);
                  const climateKey = String(climateRaw).toLowerCase();
                  const climateOn = ['on','active','heating','cooling','auxiliary','aan','actief'].includes(climateKey);
                  const climateText = climateOn ? 'Actief' :
                    ['off','inactive','uit','inactief'].includes(climateKey) ? 'Uit' : climateRaw;

                  return `
                    <div class="panel-title">AUDI STATUS</div>
                    <div class="panel-subtitle">AUDI CONNECT</div>
                    <div class="status-grid">
                      <div class="data-row"><ha-icon icon="mdi:battery-clock-outline" style="color:#4f9dff"></ha-icon><span>Resterende laadtijd</span><b>${remainingText}</b></div>
                      <div class="data-row"><ha-icon icon="mdi:map-marker-distance" style="color:#41d166"></ha-icon><span>Actieradius</span><b>${rangeText}</b></div>
                      <div class="data-row"><ha-icon icon="${locked ? 'mdi:car-door-lock' : 'mdi:car-door-lock-open'}" style="color:${locked ? '#41d166' : '#ffb41f'}"></ha-icon><span>Vergrendeling</span><b style="color:${locked ? '#41d166' : '#ffb41f'}">${doorText}</b></div>
                      <div class="data-row"><ha-icon icon="mdi:air-conditioner" style="color:${climateOn ? '#41d166' : '#98a2ad'}"></ha-icon><span>Klimaat</span><b style="color:${climateOn ? '#41d166' : '#c0c7ce'}">${climateText}</b></div>
                    </div>
                  `;
                ]]]
            styles:
              grid:
                - grid-template-areas: '"content"'
                - grid-template-columns: 1fr
              card:
                - min-height: 255px
                - padding: 22px
                - border-radius: 24px
                - background: '#30363d'
                - color: '#f6f8fa'
                - border: 1px solid '#424a53'
                - box-shadow: 0 12px 28px rgba(0,0,0,.22)
              custom_fields:
                content:
                  - width: 100%
            extra_styles: |
              .panel-title{font-size:17px;font-weight:700;letter-spacing:.08em;color:#f6f8fa}
              .panel-subtitle{font-size:12px;letter-spacing:.08em;color:#aeb7c1;margin-top:4px;margin-bottom:14px}
              .status-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}
              .data-row{min-height:66px;display:grid;grid-template-columns:28px 1fr;grid-template-areas:"icon label" "icon value";align-items:center;padding:8px 11px;border-radius:13px;background:#3a4149;border:1px solid #4b545e;color:#f2f4f7}
              .data-row ha-icon{grid-area:icon;--mdc-icon-size:22px}.data-row span{grid-area:label;font-size:12px;color:#c8d0d8}.data-row b{grid-area:value;font-size:14px;font-weight:700;color:#f2f4f7}

      ##########################################################################
      # BEDIENING
      ##########################################################################
      - type: grid
        column_span: 4
        cards:
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:button-card
                name: Nu laden
                label: Start direct
                show_label: true
                icon: mdi:play
                tap_action:
                  action: call-service
                  service: easee.action_command
                  service_data:
                    device_id: 55a98b1ed912361eaad77b77f8d509cb
                    action_command: resume
                styles:
                  card:
                    - height: 96px
                    - border-radius: 22px
                    - background: '#30363d'
                    - border: 1px solid rgba(65,209,102,.45)
                  icon:
                    - width: 31px
                    - color: '#41d166'
                  name:
                    - color: '#f6f8fa'
                    - font-size: 15px
                    - font-weight: 700
                  label:
                    - color: '#aeb7c1'
                    - font-size: 12px
                card_mod:
                  style: |
                    ha-card { background:#30363d !important; --ha-card-background:#30363d !important; }
              - type: custom:button-card
                name: Stop laden
                label: Stop direct
                show_label: true
                icon: mdi:stop
                tap_action:
                  action: call-service
                  service: easee.action_command
                  service_data:
                    device_id: 55a98b1ed912361eaad77b77f8d509cb
                    action_command: pause
                styles:
                  card:
                    - height: 96px
                    - border-radius: 22px
                    - background: '#30363d'
                    - border: 1px solid rgba(255,90,82,.45)
                  icon:
                    - width: 31px
                    - color: '#ff5a52'
                  name:
                    - color: '#f6f8fa'
                    - font-size: 15px
                    - font-weight: 700
                  label:
                    - color: '#aeb7c1'
                    - font-size: 12px
                card_mod:
                  style: |
                    ha-card { background:#30363d !important; --ha-card-background:#30363d !important; }
              - type: custom:button-card
                entity: switch.ev_smart_charging_smart_charging_activated
                name: Slim laden
                label: Tik om te wisselen
                show_label: true
                icon: mdi:ev-station
                tap_action:
                  action: toggle
                styles:
                  card:
                    - height: 96px
                    - border-radius: 22px
                    - background: '#30363d'
                    - border: 1px solid rgba(79,157,255,.45)
                  icon:
                    - width: 31px
                    - color: '[[[ return entity.state === "on" ? "#41d166" : "#98a2ad"; ]]]'
                  name:
                    - color: '#f6f8fa'
                    - font-size: 15px
                    - font-weight: 700
                  label:
                    - color: '#aeb7c1'
                    - font-size: 12px
                card_mod:
                  style: |
                    ha-card { background:#30363d !important; --ha-card-background:#30363d !important; }

      ##########################################################################
      # AUDI BEDIENING
      ##########################################################################
      - type: grid
        column_span: 4
        cards:
          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:button-card
                name: Vergrendel
                label: Audi op slot
                show_label: true
                icon: mdi:car-door-lock
                tap_action:
                  action: call-service
                  service: lock.lock
                  service_data:
                    entity_id: lock.audi_e_tron_sportback_door_lock
                styles:
                  card:
                    - height: 88px
                    - border-radius: 20px
                    - background: '#30363d'
                    - border: 1px solid rgba(65,209,102,.42)
                  icon:
                    - width: 28px
                    - color: '#41d166'
                  name:
                    - color: '#f6f8fa'
                    - font-size: 14px
                    - font-weight: 700
                  label:
                    - color: '#aeb7c1'
                    - font-size: 11px
              - type: custom:button-card
                name: Ontgrendel
                label: Houd ingedrukt
                show_label: true
                icon: mdi:car-door-lock-open
                tap_action:
                  action: none
                hold_action:
                  action: call-service
                  service: lock.unlock
                  service_data:
                    entity_id: lock.audi_e_tron_sportback_door_lock
                styles:
                  card:
                    - height: 88px
                    - border-radius: 20px
                    - background: '#30363d'
                    - border: 1px solid rgba(255,180,31,.42)
                  icon:
                    - width: 28px
                    - color: '#ffb41f'
                  name:
                    - color: '#f6f8fa'
                    - font-size: 14px
                    - font-weight: 700
                  label:
                    - color: '#aeb7c1'
                    - font-size: 11px
              - type: custom:button-card
                entity: sensor.audi_e_tron_sportback_climatisation_state
                name: Klimaat
                label: Tik starten · houd stoppen
                show_label: true
                icon: mdi:air-conditioner
                tap_action:
                  action: call-service
                  service: audiconnect.start_climate_control
                  service_data:
                    device_id: 513dbd1f6ae38b43c0bde4cc5f04aa2f
                    temp_c: 21
                hold_action:
                  action: call-service
                  service: audiconnect.execute_vehicle_action
                  service_data:
                    device_id: 513dbd1f6ae38b43c0bde4cc5f04aa2f
                    action: stop_climatisation
                styles:
                  card:
                    - height: 88px
                    - border-radius: 20px
                    - background: '#30363d'
                    - border: 1px solid rgba(79,157,255,.42)
                  icon:
                    - width: 28px
                    - color: '[[[ return ["on","active","heating","cooling","auxiliary","aan","actief"].includes(String(entity.state).toLowerCase()) ? "#41d166" : "#4f9dff"; ]]]'
                  name:
                    - color: '#f6f8fa'
                    - font-size: 14px
                    - font-weight: 700
                  label:
                    - color: '#aeb7c1'
                    - font-size: 11px
              - type: custom:button-card
                name: Verversen
                label: Audi Connect
                show_label: true
                icon: mdi:cloud-refresh
                tap_action:
                  action: call-service
                  service: audiconnect.refresh_cloud_data
                styles:
                  card:
                    - height: 88px
                    - border-radius: 20px
                    - background: '#30363d'
                    - border: 1px solid rgba(174,183,193,.42)
                  icon:
                    - width: 28px
                    - color: '#d8dee4'
                  name:
                    - color: '#f6f8fa'
                    - font-size: 14px
                    - font-weight: 700
                  label:
                    - color: '#aeb7c1'
                    - font-size: 11px

      ##########################################################################
      # STROOMPRIJS
      ##########################################################################
      - type: grid
        column_span: 4
        cards:
          - type: custom:apexcharts-card
            graph_span: 24h
            span:
              start: hour
              offset: -12h
            now:
              show: true
              label: Nu
              color: '#ffb41f'
            header:
              show: false
            apex_config:
              chart:
                height: 185
                background: '#30363d'
                foreColor: '#c5cdd5'
                toolbar:
                  show: false
              title:
                text: Stroomprijs
                align: left
                margin: 0
                offsetX: 14
                offsetY: 8
                style:
                  color: '#f6f8fa'
                  fontSize: 17px
                  fontWeight: 700
              theme:
                mode: dark
              grid:
                borderColor: '#4b545e'
                padding:
                  top: 18
                  right: 10
                  bottom: 0
                  left: 10
              xaxis:
                type: datetime
                labels:
                  datetimeUTC: false
                  format: HH:mm
                  style:
                    colors: '#aeb7c1'
              yaxis:
                decimalsInFloat: 3
                labels:
                  style:
                    colors: '#aeb7c1'
              stroke:
                curve: smooth
                width: 2
              fill:
                type: gradient
                gradient:
                  shade: dark
                  opacityFrom: 0.32
                  opacityTo: 0.03
              markers:
                size:
                  - 0
                  - 8
                strokeWidth: 3
                strokeColors: '#30363d'
              legend:
                show: false
              tooltip:
                theme: dark
                x:
                  format: HH:mm
            series:
              - entity: sensor.ev_smart_charging_charging
                name: EUR/kWh
                unit: ' €/kWh'
                type: area
                color: '#45b7ff'
                float_precision: 5
                extend_to: false
                show:
                  in_header: false
                  legend_value: false
                data_generator: |
                  const prices = entity.attributes.raw_two_days || [];
                  return prices
                    .map((entry) => [
                      new Date(entry.start).getTime(),
                      (() => {
                        const value = Number(entry.value);
                        return Math.abs(value) > 10 ? value / 1000 : value;
                      })()
                    ])
                    .filter(([start, value]) =>
                      Number.isFinite(start) && Number.isFinite(value)
                    );
              - entity: sensor.ev_smart_charging_price
                name: Huidige prijs
                unit: ' €/kWh'
                type: line
                color: '#ffb41f'
                float_precision: 5
                stroke_width: 0
                extend_to: false
                show:
                  in_header: false
                  legend_value: false
                data_generator: |
                  const value = Number(entity.state);
                  return Number.isFinite(value) ? [[Date.now(), value]] : [];
            card_mod:
              style: |
                :host {
                  display: block;
                  background: #30363d !important;
                  --ha-card-background: #30363d !important;
                  --card-background-color: #30363d !important;
                  --ha-card-border-width: 0px !important;
                  --ha-card-border-color: transparent !important;
                  --primary-text-color: #f6f8fa !important;
                  --secondary-text-color: #aeb7c1 !important;
                }
                ha-card {
                  background: #30363d !important;
                  background-color: #30363d !important;
                  --ha-card-background: #30363d !important;
                  --card-background-color: #30363d !important;
                  color: #f6f8fa !important;
                  border-radius: 24px;
                  border: none !important;
                  outline: none !important;
                  box-shadow: 0 12px 28px rgba(0,0,0,.22);
                  overflow: hidden;
                }
                .apexcharts-canvas,
                .apexcharts-svg {
                  background: #30363d !important;
                  border: none !important;
                  outline: none !important;
                }
