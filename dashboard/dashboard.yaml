title: Smart Charging
views:
  - title: Laden
    path: laden
    icon: mdi:car-electric
    type: sections
    max_columns: 3
    dense_section_placement: true
    background: "linear-gradient(145deg, #07090c 0%, #0d1116 52%, #080a0d 100%)"

    sections:
      ##########################################################################
      # AUDI / SOC
      ##########################################################################
      - type: grid
        cards:
          - type: custom:button-card
            entity: sensor.audi_e_tron_sportback_state_of_charge
            show_name: false
            show_state: false
            show_icon: false
            custom_fields:
              content: |
                [[[
                  const soc = Math.max(0, Math.min(100, Number(entity.state) || 0));
                  const target = states['sensor.audi_e_tron_sportback_target_state_of_charge']?.state ?? '—';
                  const raw = states['sensor.ev_smart_charging_status']?.state ?? 'unknown';

                  const statusText = {
                    charging: 'Bezig met laden',
                    waiting_for_charging_to_begin: 'Wachten op laadmoment',
                    no_charging_planned: 'Geen laden gepland',
                    charging_completed: 'Laden voltooid',
                    error: 'Storing'
                  }[raw] ?? raw.replaceAll('_', ' ');

                  const accent = raw === 'charging'
                    ? '#35c759'
                    : raw === 'waiting_for_charging_to_begin'
                      ? '#ffb000'
                      : raw === 'error'
                        ? '#ff453a'
                        : '#8e98a4';

                  const battery = soc < 25 ? '#ff453a' : soc < 60 ? '#ffb000' : '#35c759';

                  return `
                    <div class="hero-head">
                      <div>
                        <div class="eyebrow">AUDI E-TRON</div>
                        <div class="hero-title">Slim laden</div>
                      </div>
                      <ha-icon icon="mdi:car-electric" class="car-icon"></ha-icon>
                    </div>

                    <div class="soc-row">
                      <div class="soc">${soc}<span>%</span></div>
                      <div class="target">Doel ${target}%</div>
                    </div>

                    <div class="battery-track">
                      <div class="battery-fill" style="width:${soc}%;background:${battery}"></div>
                    </div>

                    <div class="status-pill">
                      <span style="background:${accent};box-shadow:0 0 12px ${accent}"></span>
                      ${statusText}
                    </div>
                  `;
                ]]]
            styles:
              grid:
                - grid-template-areas: '"content"'
                - grid-template-columns: 1fr
              card:
                - min-height: 290px
                - padding: 26px
                - border-radius: 26px
                - background: linear-gradient(145deg, #171b20 0%, #0d1014 100%)
                - border: 1px solid rgba(255,255,255,.08)
                - box-shadow: 0 18px 42px rgba(0,0,0,.34)
                - overflow: hidden
              custom_fields:
                content:
                  - width: 100%
            extra_styles: |
              .hero-head{display:flex;align-items:flex-start;justify-content:space-between;color:#f5f7fa}
              .eyebrow{font-size:12px;letter-spacing:.18em;color:#9ca6b2}
              .hero-title{font-size:27px;font-weight:700;margin-top:5px}
              .car-icon{--mdc-icon-size:46px;color:#d6dbe1}
              .soc-row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:27px;color:#f7f9fb}
              .soc{font-size:68px;font-weight:700;line-height:.88}
              .soc span{font-size:27px;margin-left:4px;color:#c1c8d0}
              .target{font-size:16px;color:#c1c8d0;padding-bottom:4px}
              .battery-track{height:14px;margin-top:24px;border-radius:999px;background:#292e35;overflow:hidden}
              .battery-fill{height:100%;border-radius:999px;transition:width .8s ease}
              .status-pill{display:table;margin:22px auto 0;padding:9px 15px;border-radius:999px;background:#20242a;color:#e5e9ee;font-size:14px}
              .status-pill span{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:9px}

      ##########################################################################
      # PLANNING
      ##########################################################################
      - type: grid
        cards:
          - type: custom:button-card
            entity: sensor.ev_smart_charging_status
            show_name: false
            show_state: false
            show_icon: false
            custom_fields:
              content: |
                [[[
                  const complete = states['select.ev_smart_charging_charge_completion_time']?.state ?? '—';
                  const smartOn = states['switch.ev_smart_charging_smart_charging_activated']?.state === 'on';
                  const current = Number(states['sensor.ev_smart_charging_price']?.state);
                  const next = Number(states['sensor.nord_pool_nl_volgende_prijs']?.state);
                  const money = (n) => Number.isFinite(n) ? `€ ${n.toFixed(5)} / kWh` : 'Niet beschikbaar';

                  return `
                    <div class="panel-title">PLANNING</div>
                    <div class="panel-subtitle">EV SMART CHARGING</div>

                    <div class="data-row">
                      <ha-icon icon="mdi:clock-check-outline" style="color:#2f8cff"></ha-icon>
                      <span>Klaar om</span><b>${complete}</b>
                    </div>
                    <div class="data-row">
                      <ha-icon icon="mdi:ev-station" style="color:${smartOn ? '#35c759' : '#7f8994'}"></ha-icon>
                      <span>Slim laden</span><b style="color:${smartOn ? '#35c759' : '#aeb5bd'}">${smartOn ? 'Ingeschakeld' : 'Uitgeschakeld'}</b>
                    </div>
                    <div class="data-row">
                      <ha-icon icon="mdi:currency-eur" style="color:#35c759"></ha-icon>
                      <span>Huidige prijs</span><b>${money(current)}</b>
                    </div>
                    <div class="data-row">
                      <ha-icon icon="mdi:clock-fast" style="color:#2f8cff"></ha-icon>
                      <span>Volgende prijs</span><b>${money(next)}</b>
                    </div>
                  `;
                ]]]
            tap_action:
              action: more-info
            styles:
              grid:
                - grid-template-areas: '"content"'
                - grid-template-columns: 1fr
              card:
                - min-height: 290px
                - padding: 25px
                - border-radius: 26px
                - background: linear-gradient(145deg, #151a1f 0%, #0c0f13 100%)
                - border: 1px solid rgba(255,255,255,.08)
                - box-shadow: 0 18px 42px rgba(0,0,0,.30)
              custom_fields:
                content:
                  - width: 100%
            extra_styles: |
              .panel-title{font-size:17px;font-weight:700;letter-spacing:.08em;color:#f1f4f7}
              .panel-subtitle{font-size:13px;letter-spacing:.08em;color:#8f99a5;margin-top:5px;margin-bottom:18px}
              .data-row{height:48px;display:grid;grid-template-columns:30px 1fr auto;align-items:center;padding:0 13px;margin-top:9px;border-radius:14px;background:#171b20;border:1px solid rgba(255,255,255,.06);color:#edf1f5}
              .data-row ha-icon{--mdc-icon-size:23px}
              .data-row span{font-size:15px}
              .data-row b{font-size:14px;font-weight:600;color:#e8ecf0}

      ##########################################################################
      # LAADSESSIE
      ##########################################################################
      - type: grid
        cards:
          - type: custom:button-card
            entity: sensor.links_sessie_energie
            show_name: false
            show_state: false
            show_icon: false
            custom_fields:
              content: |
                [[[
                  const value = (id, digits = 2) => {
                    const raw = states[id]?.state;
                    const number = Number(raw);
                    return Number.isFinite(number)
                      ? number.toLocaleString('nl-NL', {maximumFractionDigits: digits})
                      : (raw ?? '—');
                  };

                  const onlineRaw = (states['sensor.links_online']?.state ?? 'onbekend').toLowerCase();
                  const online = ['verbonden','online','on','true'].includes(onlineRaw);

                  return `
                    <div class="panel-title">LAADSESSIE</div>
                    <div class="panel-subtitle">EASEE</div>

                    <div class="data-row">
                      <ha-icon icon="mdi:lightning-bolt" style="color:#35c759"></ha-icon>
                      <span>Energie</span><b>${value('sensor.links_sessie_energie')} kWh</b>
                    </div>
                    <div class="data-row">
                      <ha-icon icon="mdi:current-ac" style="color:#ffb000"></ha-icon>
                      <span>Laadstroom</span><b>${value('sensor.links_laadstroom', 2)} A</b>
                    </div>
                    <div class="data-row">
                      <ha-icon icon="mdi:sine-wave" style="color:#2f8cff"></ha-icon>
                      <span>Spanning</span><b>${value('sensor.links_voltage', 1)} V</b>
                    </div>
                    <div class="data-row">
                      <ha-icon icon="mdi:access-point" style="color:${online ? '#35c759' : '#ff453a'}"></ha-icon>
                      <span>Verbinding</span><b>${states['sensor.links_online']?.state ?? 'Onbekend'}</b>
                    </div>
                  `;
                ]]]
            styles:
              grid:
                - grid-template-areas: '"content"'
                - grid-template-columns: 1fr
              card:
                - min-height: 290px
                - padding: 25px
                - border-radius: 26px
                - background: linear-gradient(145deg, #151a1f 0%, #0c0f13 100%)
                - border: 1px solid rgba(255,255,255,.08)
                - box-shadow: 0 18px 42px rgba(0,0,0,.30)
              custom_fields:
                content:
                  - width: 100%
            extra_styles: |
              .panel-title{font-size:17px;font-weight:700;letter-spacing:.08em;color:#f1f4f7}
              .panel-subtitle{font-size:13px;letter-spacing:.08em;color:#8f99a5;margin-top:5px;margin-bottom:18px}
              .data-row{height:48px;display:grid;grid-template-columns:30px 1fr auto;align-items:center;padding:0 13px;margin-top:9px;border-radius:14px;background:#171b20;border:1px solid rgba(255,255,255,.06);color:#edf1f5}
              .data-row ha-icon{--mdc-icon-size:23px}
              .data-row span{font-size:15px}
              .data-row b{font-size:14px;font-weight:600;color:#e8ecf0}

      ##########################################################################
      # BEDIENING
      ##########################################################################
      - type: grid
        column_span: 3
        cards:
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:button-card
                name: Nu laden
                label: Start direct
                show_label: true
                icon: mdi:play
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.ev_smart_charging_manually_start_charging
                styles:
                  card:
                    - height: 112px
                    - padding: 18px
                    - border-radius: 24px
                    - background: linear-gradient(145deg, #151a1f, #0c0f13)
                    - border: 1px solid rgba(53,199,89,.28)
                    - box-shadow: 0 14px 32px rgba(0,0,0,.28)
                  icon:
                    - width: 35px
                    - color: '#35c759'
                  name:
                    - color: '#f2f5f8'
                    - font-size: 16px
                    - font-weight: 700
                  label:
                    - color: '#87919d'
                    - font-size: 12px
              - type: custom:button-card
                name: Stop laden
                label: Stop direct
                show_label: true
                icon: mdi:stop
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.ev_smart_charging_manually_stop_charging
                styles:
                  card:
                    - height: 112px
                    - padding: 18px
                    - border-radius: 24px
                    - background: linear-gradient(145deg, #151a1f, #0c0f13)
                    - border: 1px solid rgba(255,69,58,.28)
                    - box-shadow: 0 14px 32px rgba(0,0,0,.28)
                  icon:
                    - width: 35px
                    - color: '#ff453a'
                  name:
                    - color: '#f2f5f8'
                    - font-size: 16px
                    - font-weight: 700
                  label:
                    - color: '#87919d'
                    - font-size: 12px
              - type: custom:button-card
                entity: switch.ev_smart_charging_smart_charging_activated
                name: Slim laden
                label: Tik om te wisselen
                show_label: true
                icon: mdi:ev-station
                tap_action:
                  action: toggle
                styles:
                  card:
                    - height: 112px
                    - padding: 18px
                    - border-radius: 24px
                    - background: linear-gradient(145deg, #151a1f, #0c0f13)
                    - border: 1px solid rgba(47,140,255,.28)
                    - box-shadow: 0 14px 32px rgba(0,0,0,.28)
                  icon:
                    - width: 35px
                    - color: '[[[ return entity.state === "on" ? "#35c759" : "#78828d"; ]]]'
                  name:
                    - color: '#f2f5f8'
                    - font-size: 16px
                    - font-weight: 700
                  label:
                    - color: '#87919d'
                    - font-size: 12px

      ##########################################################################
      # STROOMPRIJS
      ##########################################################################
      - type: grid
        column_span: 3
        cards:
          - type: custom:apexcharts-card
            graph_span: 24h
            span:
              start: day
            now:
              show: true
              label: Nu
              color: '#1aa7ec'
            header:
              show: true
              title: Stroomprijs
              show_states: false
            apex_config:
              chart:
                height: 255
                background: '#101419'
                foreColor: '#aeb7c2'
                toolbar:
                  show: false
                animations:
                  enabled: true
              theme:
                mode: dark
              grid:
                borderColor: '#293039'
                strokeDashArray: 0
              stroke:
                curve: stepline
                width: 3
              markers:
                size: 0
              tooltip:
                theme: dark
                x:
                  format: HH:mm
              xaxis:
                labels:
                  style:
                    colors: '#aeb7c2'
              yaxis:
                min: 0
                decimalsInFloat: 3
                labels:
                  style:
                    colors: '#aeb7c2'
              legend:
                show: false
            series:
              - entity: sensor.ev_smart_charging_price
                name: EUR/kWh
                type: line
                color: '#1aa7ec'
                extend_to: end
                data_generator: |
                  let raw = entity.attributes.prices_today || [];
                  if (typeof raw === 'string') {
                    try { raw = JSON.parse(raw); } catch (e) { return []; }
                  }
                  if (!Array.isArray(raw)) return [];
                  return raw.map((p) => {
                    const start = p.start || p.start_time || p.datetime;
                    const price = Number(p.price ?? p.value);
                    return [new Date(start).getTime(), price];
                  }).filter((p) => Number.isFinite(p[0]) && Number.isFinite(p[1]));
            card_mod:
              style: |
                ha-card {
                  background: #101419 !important;
                  border: 1px solid rgba(255,255,255,.08) !important;
                  border-radius: 26px !important;
                  box-shadow: 0 18px 42px rgba(0,0,0,.30) !important;
                  color: #eef2f6 !important;
                  padding: 8px 10px 4px 10px;
                  overflow: hidden;
                }
