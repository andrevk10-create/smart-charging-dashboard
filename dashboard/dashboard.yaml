title: Smart Charging
views:
  - title: Laden
    path: laden
    icon: mdi:car-electric
    type: sections
    max_columns: 3
    dense_section_placement: true
    background: "linear-gradient(145deg, #20242a 0%, #272c33 48%, #1d2126 100%)"

    sections:
      ##########################################################################
      # AUDI / SOC
      ##########################################################################
      - type: grid
        cards:
          - type: custom:button-card
            entity: sensor.audi_e_tron_sportback_state_of_charge
            show_name: false
            show_state: false
            show_icon: false
            custom_fields:
              content: |
                [[[
                  const soc = Math.max(0, Math.min(100, Number(entity.state) || 0));
                  const target = states['sensor.audi_e_tron_sportback_target_state_of_charge']?.state ?? '—';
                  const raw = states['sensor.ev_smart_charging_status']?.state ?? 'unknown';
                  const labels = {
                    charging: 'Bezig met laden',
                    waiting_for_charging_to_begin: 'Wachten op laadmoment',
                    no_charging_planned: 'Geen laden gepland',
                    charging_completed: 'Laden voltooid',
                    error: 'Storing'
                  };
                  const status = labels[raw] ?? raw.replaceAll('_',' ');
                  const accent = raw === 'charging' ? '#41d166' : raw === 'waiting_for_charging_to_begin' ? '#ffb41f' : raw === 'error' ? '#ff5a52' : '#9aa4ae';
                  const battery = soc < 25 ? '#ff5a52' : soc < 60 ? '#ffb41f' : '#41d166';
                  return `
                    <div class="hero-head">
                      <div>
                        <div class="eyebrow">AUDI E-TRON</div>
                        <div class="hero-title">Slim laden</div>
                      </div>
                      <ha-icon icon="mdi:car-electric" class="car-icon"></ha-icon>
                    </div>
                    <div class="soc-row">
                      <div class="soc">${soc}<span>%</span></div>
                      <div class="target">Doel ${target}%</div>
                    </div>
                    <div class="battery-track"><div class="battery-fill" style="width:${soc}%;background:${battery}"></div></div>
                    <div class="status-pill"><span style="background:${accent};box-shadow:0 0 12px ${accent}"></span>${status}</div>
                  `;
                ]]]
            styles:
              grid:
                - grid-template-areas: '"content"'
                - grid-template-columns: 1fr
              card:
                - min-height: 255px
                - padding: 24px
                - border-radius: 24px
                - background: '#30363d'
                - color: '#f6f8fa'
                - border: 1px solid '#424a53'
                - box-shadow: 0 12px 28px rgba(0,0,0,.22)
              custom_fields:
                content:
                  - width: 100%
            card_mod:
              style: |
                ha-card {
                  background: #30363d !important;
                  --ha-card-background: #30363d !important;
                  color: #f6f8fa !important;
                }
            extra_styles: |
              .hero-head{display:flex;align-items:flex-start;justify-content:space-between;color:#f6f8fa}
              .eyebrow{font-size:12px;letter-spacing:.18em;color:#aeb7c1}
              .hero-title{font-size:27px;font-weight:700;margin-top:5px}
              .car-icon{--mdc-icon-size:44px;color:#d8dee4}
              .soc-row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:24px;color:#f6f8fa}
              .soc{font-size:64px;font-weight:700;line-height:.9}.soc span{font-size:25px;margin-left:4px;color:#c6ced6}
              .target{font-size:16px;color:#c6ced6;padding-bottom:4px}
              .battery-track{height:13px;margin-top:22px;border-radius:999px;background:#454c55;overflow:hidden}
              .battery-fill{height:100%;border-radius:999px;transition:width .8s ease}
              .status-pill{display:table;margin:20px auto 0;padding:8px 14px;border-radius:999px;background:#3a4149;color:#f0f3f6;font-size:14px;border:1px solid #4b545e}
              .status-pill span{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:9px}

      ##########################################################################
      # PLANNING
      ##########################################################################
      - type: grid
        cards:
          - type: custom:button-card
            entity: sensor.ev_smart_charging_status
            show_name: false
            show_state: false
            show_icon: false
            custom_fields:
              content: |
                [[[
                  const complete = states['select.ev_smart_charging_charge_completion_time']?.state ?? '—';
                  const smartOn = states['switch.ev_smart_charging_smart_charging_activated']?.state === 'on';
                  const current = Number(states['sensor.ev_smart_charging_price']?.state);
                  const next = Number(states['sensor.nord_pool_nl_volgende_prijs']?.state);
                  const money = n => Number.isFinite(n) ? `€ ${n.toFixed(5)} / kWh` : 'Niet beschikbaar';
                  return `
                    <div class="panel-title">PLANNING</div>
                    <div class="panel-subtitle">EV SMART CHARGING</div>
                    <div class="data-row"><ha-icon icon="mdi:clock-check-outline" style="color:#4f9dff"></ha-icon><span>Klaar om</span><b>${complete}</b></div>
                    <div class="data-row"><ha-icon icon="mdi:ev-station" style="color:${smartOn ? '#41d166' : '#98a2ad'}"></ha-icon><span>Slim laden</span><b style="color:${smartOn ? '#41d166' : '#c0c7ce'}">${smartOn ? 'Ingeschakeld' : 'Uitgeschakeld'}</b></div>
                    <div class="data-row"><ha-icon icon="mdi:currency-eur" style="color:#41d166"></ha-icon><span>Huidige prijs</span><b>${money(current)}</b></div>
                    <div class="data-row"><ha-icon icon="mdi:clock-fast" style="color:#4f9dff"></ha-icon><span>Volgende prijs</span><b>${money(next)}</b></div>
                  `;
                ]]]
            styles:
              grid:
                - grid-template-areas: '"content"'
                - grid-template-columns: 1fr
              card:
                - min-height: 255px
                - padding: 22px
                - border-radius: 24px
                - background: '#30363d'
                - color: '#f6f8fa'
                - border: 1px solid '#424a53'
                - box-shadow: 0 12px 28px rgba(0,0,0,.22)
              custom_fields:
                content:
                  - width: 100%
            card_mod:
              style: |
                ha-card {
                  background: #30363d !important;
                  --ha-card-background: #30363d !important;
                  color: #f6f8fa !important;
                }
            extra_styles: |
              .panel-title{font-size:17px;font-weight:700;letter-spacing:.08em;color:#f6f8fa}
              .panel-subtitle{font-size:12px;letter-spacing:.08em;color:#aeb7c1;margin-top:4px;margin-bottom:14px}
              .data-row{height:43px;display:grid;grid-template-columns:29px 1fr auto;align-items:center;padding:0 12px;margin-top:8px;border-radius:13px;background:#3a4149;border:1px solid #4b545e;color:#f2f4f7}
              .data-row ha-icon{--mdc-icon-size:22px}.data-row span{font-size:14px}.data-row b{font-size:13px;font-weight:600;color:#f2f4f7}

      ##########################################################################
      # LAADSESSIE
      ##########################################################################
      - type: grid
        cards:
          - type: custom:button-card
            entity: sensor.links_sessie_energie
            show_name: false
            show_state: false
            show_icon: false
            custom_fields:
              content: |
                [[[
                  const value = (id,d=2) => {
                    const raw = states[id]?.state;
                    const n = Number(raw);
                    return Number.isFinite(n) ? n.toLocaleString('nl-NL',{maximumFractionDigits:d}) : (raw ?? '—');
                  };
                  const onlineRaw = (states['sensor.links_online']?.state ?? 'onbekend').toLowerCase();
                  const online = ['verbonden','online','on','true'].includes(onlineRaw);
                  return `
                    <div class="panel-title">LAADSESSIE</div>
                    <div class="panel-subtitle">EASEE</div>
                    <div class="data-row"><ha-icon icon="mdi:lightning-bolt" style="color:#41d166"></ha-icon><span>Energie</span><b>${value('sensor.links_sessie_energie')} kWh</b></div>
                    <div class="data-row"><ha-icon icon="mdi:current-ac" style="color:#ffb41f"></ha-icon><span>Laadstroom</span><b>${value('sensor.links_laadstroom',2)} A</b></div>
                    <div class="data-row"><ha-icon icon="mdi:sine-wave" style="color:#4f9dff"></ha-icon><span>Spanning</span><b>${value('sensor.links_voltage',1)} V</b></div>
                    <div class="data-row"><ha-icon icon="mdi:access-point" style="color:${online ? '#41d166' : '#ff5a52'}"></ha-icon><span>Verbinding</span><b>${states['sensor.links_online']?.state ?? 'Onbekend'}</b></div>
                  `;
                ]]]
            styles:
              grid:
                - grid-template-areas: '"content"'
                - grid-template-columns: 1fr
              card:
                - min-height: 255px
                - padding: 22px
                - border-radius: 24px
                - background: '#30363d'
                - color: '#f6f8fa'
                - border: 1px solid '#424a53'
                - box-shadow: 0 12px 28px rgba(0,0,0,.22)
              custom_fields:
                content:
                  - width: 100%
            card_mod:
              style: |
                ha-card {
                  background: #30363d !important;
                  --ha-card-background: #30363d !important;
                  color: #f6f8fa !important;
                }
            extra_styles: |
              .panel-title{font-size:17px;font-weight:700;letter-spacing:.08em;color:#f6f8fa}
              .panel-subtitle{font-size:12px;letter-spacing:.08em;color:#aeb7c1;margin-top:4px;margin-bottom:14px}
              .data-row{height:43px;display:grid;grid-template-columns:29px 1fr auto;align-items:center;padding:0 12px;margin-top:8px;border-radius:13px;background:#3a4149;border:1px solid #4b545e;color:#f2f4f7}
              .data-row ha-icon{--mdc-icon-size:22px}.data-row span{font-size:14px}.data-row b{font-size:13px;font-weight:600;color:#f2f4f7}

      ##########################################################################
      # BEDIENING
      ##########################################################################
      - type: grid
        column_span: 3
        cards:
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:button-card
                name: Nu laden
                label: Start direct
                show_label: true
                icon: mdi:play
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.ev_smart_charging_manually_start_charging
                styles:
                  card:
                    - height: 96px
                    - border-radius: 22px
                    - background: '#30363d'
                    - border: 1px solid rgba(65,209,102,.45)
                  icon:
                    - width: 31px
                    - color: '#41d166'
                  name:
                    - color: '#f6f8fa'
                    - font-size: 15px
                    - font-weight: 700
                  label:
                    - color: '#aeb7c1'
                    - font-size: 12px
                card_mod:
                  style: |
                    ha-card { background:#30363d !important; --ha-card-background:#30363d !important; }
              - type: custom:button-card
                name: Stop laden
                label: Stop direct
                show_label: true
                icon: mdi:stop
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.ev_smart_charging_manually_stop_charging
                styles:
                  card:
                    - height: 96px
                    - border-radius: 22px
                    - background: '#30363d'
                    - border: 1px solid rgba(255,90,82,.45)
                  icon:
                    - width: 31px
                    - color: '#ff5a52'
                  name:
                    - color: '#f6f8fa'
                    - font-size: 15px
                    - font-weight: 700
                  label:
                    - color: '#aeb7c1'
                    - font-size: 12px
                card_mod:
                  style: |
                    ha-card { background:#30363d !important; --ha-card-background:#30363d !important; }
              - type: custom:button-card
                entity: switch.ev_smart_charging_smart_charging_activated
                name: Slim laden
                label: Tik om te wisselen
                show_label: true
                icon: mdi:ev-station
                tap_action:
                  action: toggle
                styles:
                  card:
                    - height: 96px
                    - border-radius: 22px
                    - background: '#30363d'
                    - border: 1px solid rgba(79,157,255,.45)
                  icon:
                    - width: 31px
                    - color: '[[[ return entity.state === "on" ? "#41d166" : "#98a2ad"; ]]]'
                  name:
                    - color: '#f6f8fa'
                    - font-size: 15px
                    - font-weight: 700
                  label:
                    - color: '#aeb7c1'
                    - font-size: 12px
                card_mod:
                  style: |
                    ha-card { background:#30363d !important; --ha-card-background:#30363d !important; }

      ##########################################################################
      # STROOMPRIJS
      ##########################################################################
      - type: grid
        column_span: 3
        cards:
          - type: custom:apexcharts-card
            graph_span: 24h
            span:
              start: day
            now:
              show: true
              label: Nu
              color: '#45b7ff'
            header:
              show: true
              title: Stroomprijs
              show_states: false
            apex_config:
              chart:
                height: 235
                background: '#30363d'
                foreColor: '#c5cdd5'
                toolbar:
                  show: false
              theme:
                mode: dark
              grid:
                borderColor: '#4b545e'
              stroke:
                curve: smooth
                width: 3
              markers:
                size: 0
              tooltip:
                theme: dark
                x:
                  format: HH:mm
              yaxis:
                decimalsInFloat: 3
            series:
              - entity: sensor.ev_smart_charging_price
                name: EUR/kWh
                type: line
                color: '#45b7ff'
                data_generator: |
                  const raw = entity.attributes.prices_today || [];
                  return raw.map((p) => {
                    const start = p.start || p.start_time || p.datetime;
                    const price = Number(p.price ?? p.value ?? 0);
                    return [new Date(start).getTime(), price];
                  });
            card_mod:
              style: |
                ha-card {
                  background: #30363d !important;
                  --ha-card-background: #30363d !important;
                  color: #f6f8fa !important;
                  border-radius: 24px;
                  border: 1px solid #424a53;
                  box-shadow: 0 12px 28px rgba(0,0,0,.22);
                  overflow: hidden;
                }
